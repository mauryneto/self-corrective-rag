[project]
name = "self-corrective-rag"
version = "0.1.0"
description = "Self-corrective RAG over Brazilian health-insurance regulation (ANS), with an eval harness that measures quality, latency and cost."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "pgvector>=0.3",
    "playwright>=1.65.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sentence-transformers>=6.3.0",
    "torch>=2.9",
    "uvicorn>=0.30",
]

[dependency-groups]
demo = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

# The reranker runs on the GPU in V4. On Windows the PyPI build of torch is CPU-only, so the CUDA
# build comes from PyTorch's own index; elsewhere PyPI's torch is used as before.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
